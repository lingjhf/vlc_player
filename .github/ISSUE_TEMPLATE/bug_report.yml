name: Bug report
description: Report a reproducible vlc_player issue
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform is affected?
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Device, simulator, emulator, or desktop model.
      placeholder: "Example: Pixel 8 Pro, iPhone 15 simulator, MacBook Pro M3"
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter version
      description: Output from `flutter --version` is preferred.
      placeholder: "Example: Flutter 3.44.0"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: vlc_player version
      placeholder: "Example: 2.1.1"
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: Problem description
      description: Describe what went wrong.
      placeholder: "What happened? When does it happen?"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Example: Android 15, iOS 18.5, macOS 15.5, Windows 11"

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Steps, sample code, or a minimal reproduction project.
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      placeholder: "What did you expect to happen?"

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      placeholder: "What happened instead?"

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings
      description: Paste logs or drag files into this field.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context that may help diagnose the issue.
