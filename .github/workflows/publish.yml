name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tag matches pubspec version
        run: bash tool/ci/verify_tag_version.sh

      - name: Show Flutter version
        run: flutter --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib test example/lib example/test example/integration_test example/test_driver

      - name: Run package tests
        run: flutter test

      - name: Run example widget tests
        working-directory: example
        run: flutter test test/widget_test.dart

      - name: Validate pub.dev package
        run: flutter pub publish --dry-run

      - name: Build iOS example
        working-directory: example
        run: flutter build ios --no-codesign

      - name: Build macOS example
        working-directory: example
        run: flutter build macos

      - name: Run macOS integration tests
        working-directory: example
        timeout-minutes: 20
        run: flutter test integration_test/plugin_integration_test.dart -d macos

      - name: Run macOS format compatibility tests
        working-directory: example
        timeout-minutes: 20
        run: flutter test integration_test/format_compatibility_test.dart -d macos

  validate-android:
    name: Validate Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tag matches pubspec version
        run: bash tool/ci/verify_tag_version.sh

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug

      - name: Verify Android 16 KB native page-size support
        run: bash tool/ci/check_android_16kb_page_size.sh example/build/app/outputs/flutter-apk/app-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: example
          script: |
            flutter drive --no-dds --timeout=1200 -d emulator-5554 --driver=test_driver/integration_test.dart --target=integration_test/plugin_integration_test.dart
            flutter drive --no-dds --timeout=1200 -d emulator-5554 --dart-define=VLC_PLAYER_FORMAT_SUITE=smoke --driver=test_driver/integration_test.dart --target=integration_test/format_compatibility_test.dart

  validate-windows:
    name: Validate Windows release
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tag matches pubspec version
        shell: bash
        run: bash tool/ci/verify_tag_version.sh

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Windows example
        working-directory: example
        run: flutter build windows

      - name: Run Windows native tests
        working-directory: example/build/windows/x64/plugins/vlc_player
        run: ctest -C Release --output-on-failure --no-tests=error

      - name: Run Windows integration tests
        working-directory: example
        run: flutter drive --no-dds --timeout=1200 -d windows --driver=test_driver/integration_test.dart --target=integration_test/plugin_integration_test.dart

      - name: Run Windows format compatibility tests
        working-directory: example
        run: flutter drive --no-dds --timeout=1200 -d windows --driver=test_driver/integration_test.dart --target=integration_test/format_compatibility_test.dart

  validate-linux:
    name: Validate Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev libvlc-dev ninja-build pkg-config vlc xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tag matches pubspec version
        run: bash tool/ci/verify_tag_version.sh

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Linux example
        working-directory: example
        run: flutter build linux

      - name: Run Linux native tests
        working-directory: example/build/linux/x64/release/plugins/vlc_player
        run: ctest --output-on-failure --no-tests=error

      - name: Run Linux integration tests
        working-directory: example
        run: xvfb-run -a flutter drive --no-dds --timeout=1200 -d linux --driver=test_driver/integration_test.dart --target=integration_test/plugin_integration_test.dart


  publish:
    name: Publish
    needs:
      - validate
      - validate-android
      - validate-windows
      - validate-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Dart OIDC
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish
        run: flutter pub publish --force
